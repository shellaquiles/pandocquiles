name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax
        run: python3 -m py_compile src/python/*.py

      - name: Node syntax (webhook)
        run: node --check src/webhooks/drive_webhook.js

      - name: Documentación
        run: test -f README.md && test -d docs
